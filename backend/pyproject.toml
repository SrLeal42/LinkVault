[project]
name = "linkvault-backend"
version = "0.1.0"
description = "Backend da aplicação LinkVault — API REST com FastAPI e PostgreSQL"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2.0",
    "alembic>=1.14.0",
    "argon2-cffi>=23.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
    "mypy>=1.14.0",
]

# ==============================================================================
# Ruff (Lint & Format)
# ==============================================================================
[tool.ruff]
target-version = "py314"
line-length = 100
src = ["app", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort (ordenação de imports)
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
    "SIM",    # flake8-simplify
    "TCH",    # flake8-type-checking
    "RUF",    # regras nativas do Ruff
    "S",      # flake8-bandit (segurança básica)
]
ignore = [
    "B008",   # Permite Depends() como valor default nos argumentos de rotas FastAPI
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",   # Permite uso de 'assert' nos testes do pytest
    "S105",   # Permite strings de senhas fictícias em testes
    "S106",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ==============================================================================
# mypy (Verificação Estática de Tipos — Strict)
# ==============================================================================
[tool.mypy]
python_version = "3.14"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."
packages = ["app", "tests", "scripts"]
show_error_codes = true
warn_unreachable = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ==============================================================================
# pytest
# ==============================================================================
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q --strict-markers"