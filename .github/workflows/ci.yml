name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (Ruff, mypy, Alembic, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: linkvault
          POSTGRES_PASSWORD: linkvault_test
          POSTGRES_DB: linkvault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U linkvault -d linkvault_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=5

    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://linkvault:linkvault_test@localhost:5432/linkvault_test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          python-version: "3.14"

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run Ruff linter
        run: uv run ruff check .

      - name: Run Ruff formatter check
        run: uv run ruff format --check .

      - name: Run mypy static type checker
        run: uv run mypy

      - name: Apply Alembic migrations
        run: uv run alembic upgrade head

      - name: Run pytest suite
        run: uv run pytest

  frontend:
    name: Frontend (ESLint, TypeScript, Vitest, Build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm run lint

      - name: Run TypeScript typecheck
        run: pnpm run typecheck

      - name: Run unit tests (Vitest)
        run: pnpm test

      - name: Build production bundle
        run: pnpm run build

  api-contract:
    name: API Contract (OpenAPI -> TypeScript)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up uv and Python 3.14
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: "backend/uv.lock"
          python-version: "3.14"

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --frozen

      - name: Export OpenAPI schema from FastAPI
        working-directory: backend
        run: uv run python -m scripts.export_openapi

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile

      - name: Generate TypeScript schema from OpenAPI
        working-directory: frontend
        run: pnpm run generate:api

      - name: Verify schema.d.ts is up to date
        run: git diff --exit-code frontend/src/api/schema.d.ts