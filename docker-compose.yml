services:
  db:
    image: postgres:17-alpine
    container_name: linkvault-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-linkvault}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-linkvault_dev}
      POSTGRES_DB: ${POSTGRES_DB:-linkvault}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-linkvault} -d ${POSTGRES_DB:-linkvault}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: